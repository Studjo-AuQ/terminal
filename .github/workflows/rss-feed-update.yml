name: RSS-Feed aktualisieren

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  rss-holen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Beide RSS-Feeds holen und als JSON speichern
        run: |
          python3 << 'PYTHON'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          from datetime import datetime, timezone

          # ── Konfiguration ─────────────────────────────────────────
          FEEDS = [
              {
                  'datei':  'nachrichten.json',
                  'urls': [
                      'https://www.nachrichtenleicht.de/nachrichtenleicht-nachrichten-100.rss',
                      'https://www.deutschlandfunk.de/podcast-nachrichtenleicht-der-wochenrueckblick-in-einfacher-sprache-100.xml',
                  ],
                  'max': 12,
              },
              {
                  'datei':  'tagesschau.json',
                  'urls': [
                      'https://www.tagesschau.de/xml/rss2/',
                      'https://www.tagesschau.de/inland/index~rss2.xml',
                  ],
                  'max': 15,
              },
          ]
          # ─────────────────────────────────────────────────────────

          # ╔══════════════════════════════════════════════════════════════════════╗
# ║  SNIPPET – in Deinen bestehenden RSS-Fetch-Workflow einfügen        ║
# ║  Suche darin nach dem Schritt der nachrichten.json oder             ║
# ║  tagesschau.json erstellt und füge diesen Block DARUNTER ein.       ║
# ║  Außerdem: In dem "git add"-Schritt "kobinet.json" ergänzen.        ║
# ╚══════════════════════════════════════════════════════════════════════╝

      # ── NEU: Kobinet-Nachrichten (Nachrichten über Behinderung & Teilhabe) ──
      - name: Kobinet-Nachrichten RSS abrufen und speichern
        run: |
          python3 << 'PYTHON'
import urllib.request, json, re
import xml.etree.ElementTree as ET
from datetime import datetime, timezone

FEED_URL = "https://feeds.feedburner.com/Kobinet-nachrichten"
OUTPUT   = "kobinet.json"
MAX_ITEMS = 12

req = urllib.request.Request(FEED_URL, headers={
    "User-Agent": "Mozilla/5.0 (Studjo-Terminal/1.0; RSS-Reader)"
})

# ── Feed abrufen ────────────────────────────────────────────────────────
try:
    with urllib.request.urlopen(req, timeout=20) as resp:
        raw = resp.read().decode("utf-8", errors="replace")
except Exception as e:
    result = {
        "source": "kobinet-nachrichten.org",
        "updated": "Fehler beim Abrufen",
        "error": str(e),
        "items": []
    }
    with open(OUTPUT, "w", encoding="utf-8") as f:
        json.dump(result, f, ensure_ascii=False)
    print(f"FEHLER: {e}")
    exit(0)

# ── XML parsen (Namespaces bereinigen) ──────────────────────────────────
raw = re.sub(r'\s+xmlns(?::[^=]+)?="[^"]*"', '', raw)
raw = re.sub(r'<\?xml[^?]*\?>', '', raw)

try:
    root = ET.fromstring(raw)
except ET.ParseError as e:
    result = {
        "source": "kobinet-nachrichten.org",
        "updated": "Parse-Fehler",
        "error": str(e),
        "items": []
    }
    with open(OUTPUT, "w", encoding="utf-8") as f:
        json.dump(result, f, ensure_ascii=False)
    print(f"XML PARSE FEHLER: {e}")
    exit(0)

# ── Artikel extrahieren ─────────────────────────────────────────────────
items = []
for item in root.findall(".//item")[:MAX_ITEMS]:
    title = (item.findtext("title") or "").strip()
    desc  = (item.findtext("description") or "").strip()
    link  = (item.findtext("link") or "").strip()
    date  = (item.findtext("pubDate") or "").strip()

    # HTML-Tags aus Beschreibung entfernen
    desc = re.sub(r"<[^>]+>", " ", desc)
    desc = re.sub(r"\s+", " ", desc).strip()

    # Auf 280 Zeichen kürzen
    if len(desc) > 280:
        desc = desc[:277] + "…"

    if title:
        items.append({
            "title":       title,
            "description": desc,
            "link":        link,
            "pubDate":     date
        })

# ── Zeitstempel und Speichern ───────────────────────────────────────────
now = datetime.now(timezone.utc)
result = {
    "source":  "kobinet-nachrichten.org",
    "updated": now.strftime("%d.%m.%Y, %H:%M Uhr"),
    "items":   items
}

with open(OUTPUT, "w", encoding="utf-8") as f:
    json.dump(result, f, ensure_ascii=False, indent=2)

print(f"kobinet.json: {len(items)} Artikel gespeichert ({now.strftime('%H:%M UTC')})")
PYTHON
          
          
          
          
          
          
          def html_entfernen(text):
              if not text:
                  return ''
              text = re.sub(r'<[^>]+>', ' ', text)
              for entity, ersatz in [('&amp;','&'),('&lt;','<'),('&gt;','>'),
                                     ('&quot;','"'),('&#39;',"'"),('&nbsp;',' ')]:
                  text = text.replace(entity, ersatz)
              return re.sub(r'\s+', ' ', text).strip()

          def parse_datum(s):
              for fmt in ['%a, %d %b %Y %H:%M:%S %z','%a, %d %b %Y %H:%M:%S %Z',
                          '%Y-%m-%dT%H:%M:%S%z','%Y-%m-%dT%H:%M:%SZ']:
                  try:
                      return datetime.strptime(s.strip(), fmt).isoformat()
                  except:
                      pass
              return s

          def hole_feed(url, max_meldungen):
              req = urllib.request.Request(url, headers={'User-Agent': 'Studjo-Infoterminal/1.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  inhalt = r.read()
              root    = ET.fromstring(inhalt)
              channel = root.find('channel')
              if channel is not None:
                  quelle = (channel.findtext('title') or '').strip()
                  items  = channel.findall('item')
              else:
                  ns     = 'http://www.w3.org/2005/Atom'
                  quelle = (root.findtext(f'{{{ns}}}title') or '').strip()
                  items  = root.findall(f'{{{ns}}}entry')

              meldungen = []
              for item in items[:max_meldungen]:
                  def txt(tag, atom=None):
                      el = item.find(tag)
                      if el is None and atom:
                          el = item.find(f'{{http://www.w3.org/2005/Atom}}{atom}')
                      return el.text or '' if el is not None else ''

                  # Bild-URL versuchen zu extrahieren (media:thumbnail oder enclosure)
                  bild = ''
                  media_thumb = item.find('{http://search.yahoo.com/mrss/}thumbnail')
                  if media_thumb is not None:
                      bild = media_thumb.get('url', '')
                  if not bild:
                      enclosure = item.find('enclosure')
                      if enclosure is not None and 'image' in enclosure.get('type',''):
                          bild = enclosure.get('url', '')

                  titel = html_entfernen(txt('title', 'title'))
                  desc  = html_entfernen(txt('description', 'summary'))
                  datum = parse_datum(txt('pubDate', 'published'))

                  if titel:
                      meldungen.append({
                          'title':       titel,
                          'description': desc,
                          'pubDate':     datum,
                          'bild':        bild,
                      })
              return quelle, meldungen

          jetzt = datetime.now(timezone.utc).strftime('%d.%m.%Y, %H:%M Uhr (UTC)')

          for feed_cfg in FEEDS:
              meldungen  = []
              quelle     = ''
              fehler_log = []

              for url in feed_cfg['urls']:
                  try:
                      print(f"Lade: {url}")
                      quelle, meldungen = hole_feed(url, feed_cfg['max'])
                      print(f"  → {len(meldungen)} Meldungen von '{quelle}'")
                      break
                  except Exception as e:
                      fehler_log.append(f"{url}: {e}")
                      print(f"  → Fehler: {e}")

              ausgabe = {
                  'quelle':       quelle or 'Nachrichten',
                  'aktualisiert': jetzt,
                  'meldungen':    meldungen,
                  'fehler':       fehler_log if not meldungen else [],
              }
              with open(feed_cfg['datei'], 'w', encoding='utf-8') as f:
                  json.dump(ausgabe, f, ensure_ascii=False, indent=2)
              status = f"{len(meldungen)} Meldungen" if meldungen else "FEHLER"
              print(f"Gespeichert: {feed_cfg['datei']} ({status})")
          PYTHON

      - name: Änderungen ins Repository übertragen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nachrichten.json tagesschau.json kobinet.json
          git diff --staged --quiet || git commit -m "RSS-Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
