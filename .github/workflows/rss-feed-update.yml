name: RSS-Feed aktualisieren

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  rss-holen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Datenordner sicherstellen
        run: mkdir -p data

      - name: Alle RSS-Feeds holen und als JSON speichern
        run: |
          python3 << 'PYTHON'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import html
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          FEEDS = [
              {
                  'datei': 'data/nachrichten.json',
                  'urls': [
                      'https://www.nachrichtenleicht.de/nachrichtenleicht-nachrichten-100.rss',
                      'https://www.deutschlandfunk.de/podcast-nachrichtenleicht-der-wochenrueckblick-in-einfacher-sprache-100.xml',
                  ],
                  'max': 12,
              },
              {
                  'datei': 'data/tagesschau.json',
                  'urls': [
                      'https://www.tagesschau.de/xml/rss2/',
                      'https://www.tagesschau.de/inland/index~rss2.xml',
                  ],
                  'max': 15,
              },
              {
                  'datei': 'data/kobinet.json',
                  'urls': [
                      'https://feeds.feedburner.com/Kobinet-nachrichten',
                  ],
                  'max': 12,
              },
          ]

          def html_entfernen(text):
              if not text:
                  return ''
              # Erst Entities dekodieren, danach HTML entfernen.
              # Sonst würde z. B. &lt;img ...&gt; erst NACH dem Filter
              # wieder zu echtem HTML werden.
              text = html.unescape(text)
              text = re.sub(r'<[^>]+>', ' ', text)
              return re.sub(r'\s+', ' ', text).strip()

          def parse_datum(s):
              for fmt in [
                  '%a, %d %b %Y %H:%M:%S %z',
                  '%a, %d %b %Y %H:%M:%S %Z',
                  '%Y-%m-%dT%H:%M:%S%z',
                  '%Y-%m-%dT%H:%M:%SZ'
              ]:
                  try:
                      return datetime.strptime(
                          s.strip(),
                          fmt
                      ).isoformat()
                  except Exception:
                      pass
              return s

          def atom_text(item, name):
              ns = 'http://www.w3.org/2005/Atom'
              el = item.find(f'{{{ns}}}{name}')
              return el.text or '' if el is not None else ''

          def item_link(item):
              link = (item.findtext('link') or '').strip()
              if link:
                  return link

              ns = 'http://www.w3.org/2005/Atom'

              for el in item.findall(f'{{{ns}}}link'):
                  href = (el.attrib.get('href') or '').strip()
                  rel = (el.attrib.get('rel') or 'alternate').strip()

                  if href and rel in ('alternate', ''):
                      return href

              return ''

          def stabile_id(item, titel, datum, link):
              guid = (item.findtext('guid') or '').strip()

              if not guid:
                  guid = atom_text(item, 'id').strip()

              basis = guid or link or (titel + '|' + datum)

              return hashlib.sha1(
                  basis.encode('utf-8')
              ).hexdigest()[:20]

          def hole_feed(url, max_meldungen):
              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Studjo-Infoterminal/1.0'
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as r:
                  inhalt = r.read()

              root = ET.fromstring(inhalt)
              channel = root.find('channel')

              if channel is not None:
                  quelle = (
                      channel.findtext('title') or ''
                  ).strip()
                  items = channel.findall('item')
              else:
                  ns = 'http://www.w3.org/2005/Atom'
                  quelle = (
                      root.findtext(f'{{{ns}}}title') or ''
                  ).strip()
                  items = root.findall(f'{{{ns}}}entry')

              meldungen = []

              for item in items[:max_meldungen]:
                  def txt(tag, atom=None):
                      el = item.find(tag)

                      if el is None and atom:
                          el = item.find(
                              f'{{http://www.w3.org/2005/Atom}}{atom}'
                          )

                      return el.text or '' if el is not None else ''

                  titel = html_entfernen(
                      txt('title', 'title')
                  )
                  desc = html_entfernen(
                      txt('description', 'summary')
                  )
                  datum = parse_datum(
                      txt('pubDate', 'published')
                  )
                  link = item_link(item)

                  if titel:
                      meldungen.append({
                          'id': stabile_id(
                              item,
                              titel,
                              datum,
                              link
                          ),
                          'title': titel,
                          'description': desc,
                          'pubDate': datum,
                          'link': link,
                          'bild': '',
                      })

              return quelle, meldungen

          def lade_bisherigen_stand(datei):
              pfad = Path(datei)

              if not pfad.exists():
                  return None

              try:
                  daten = json.loads(
                      pfad.read_text(
                          encoding='utf-8'
                      )
                  )

                  if daten.get('meldungen'):
                      return daten

              except Exception as e:
                  print(
                      f'Bisheriger Stand von {datei} '
                      f'konnte nicht gelesen werden: {e}'
                  )

              return None

          jetzt = datetime.now(
              timezone.utc
          ).strftime(
              '%d.%m.%Y, %H:%M Uhr (UTC)'
          )

          harte_fehler = []

          for feed_cfg in FEEDS:
              datei = feed_cfg['datei']
              bisher = lade_bisherigen_stand(datei)
              meldungen = []
              quelle = ''
              fehler_log = []

              for url in feed_cfg['urls']:
                  try:
                      print(f'Lade: {url}')

                      kandidat_quelle, kandidat_meldungen = hole_feed(
                          url,
                          feed_cfg['max']
                      )

                      if not kandidat_meldungen:
                          raise RuntimeError(
                              'Feed lieferte keine Meldungen.'
                          )

                      quelle = kandidat_quelle
                      meldungen = kandidat_meldungen

                      print(
                          f'  → {len(meldungen)} Meldungen '
                          f"von '{quelle}'"
                      )
                      break

                  except Exception as e:
                      fehler_log.append(
                          f'{url}: {e}'
                      )
                      print(f'  → Fehler: {e}')

              if meldungen:
                  ausgabe = {
                      'quelle': quelle or 'Nachrichten',
                      'aktualisiert': jetzt,
                      'meldungen': meldungen,
                      'fehler': [],
                  }

                  with open(
                      datei,
                      'w',
                      encoding='utf-8'
                  ) as f:
                      json.dump(
                          ausgabe,
                          f,
                          ensure_ascii=False,
                          indent=2
                      )

                  print(
                      f'Gespeichert: {datei} '
                      f'({len(meldungen)} Meldungen)'
                  )
                  continue

              if bisher:
                  print(
                      '::warning::'
                      f'{datei}: Alle Abrufe fehlgeschlagen. '
                      'Der letzte funktionierende Datenstand bleibt '
                      'unverändert erhalten.'
                  )
                  for fehler in fehler_log:
                      print('  ' + fehler)
                  continue

              harte_fehler.append(
                  f'{datei}: kein neuer und kein bisheriger '
                  'brauchbarer Nachrichtenbestand. ' +
                  ' | '.join(fehler_log)
              )

          if harte_fehler:
              raise RuntimeError(
                  'RSS-Update ohne brauchbaren Fallback:\n' +
                  '\n'.join(harte_fehler)
              )
          PYTHON

      - name: Änderungen ins Repository übertragen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nachrichten.json data/tagesschau.json data/kobinet.json
          git diff --staged --quiet || git commit -m "RSS-Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
