# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Studjo Infoterminal – Feedback per E-Mail weiterleiten             ║
# ║  Datei muss gespeichert werden als:                                 ║
# ║  .github/workflows/feedback-email.yml  (im Terminal-Repository)    ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: 📝 Feedback per E-Mail weiterleiten

on:
  repository_dispatch:
    types: [feedback-terminal]   # wird durch das Formular ausgelöst

jobs:
  email-senden:
    runs-on: ubuntu-latest

    steps:
      - name: Feedback-E-Mail senden
        uses: dawidd6/action-send-mail@v3
        with:
          # ── SMTP-Verbindung (Gmail) ──────────────────────────────
          server_address: smtp.gmail.com
          server_port:    587
          secure:         false        # STARTTLS auf Port 587
          username:       ${{ secrets.FEEDBACK_GMAIL_USER }}
          password:       ${{ secrets.FEEDBACK_GMAIL_PASSWORD }}

          # ── Empfänger & Absender ─────────────────────────────────
          to:   studjomk@gmail.com, marc.brenzel@johanneswerk.de
          from: "Studjo Infoterminal <${{ secrets.FEEDBACK_GMAIL_USER }}>"

          # ── Betreff ──────────────────────────────────────────────
          subject: >-
            📝 Neues Terminal-Feedback –
            ${{ github.event.client_payload.gesamteindruck }} –
            ${{ github.event.client_payload.datum }}

          # ── E-Mail-Inhalt (HTML) ─────────────────────────────────
          # Hinweis: Der >- Operator macht aus den Zeilen eine einzige
          # Zeile (HTML ignoriert Zeilenumbrüche ohnehin).
          html_body: >-
            <div style="font-family:Arial,Helvetica,sans-serif;max-width:640px;margin:0 auto;border:1px solid #ddd;border-radius:10px;overflow:hidden">

            <div style="background:#b61f29;color:#fff;padding:18px 24px">
            <h2 style="margin:0;font-size:1.15rem;font-weight:800">
            📝 Neues Feedback – Studjo Infoterminal
            </h2>
            </div>

            <div style="padding:22px 24px;background:#fafafa">
            <table style="width:100%;border-collapse:collapse;font-size:0.95rem">

            <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;font-weight:bold;width:36%;vertical-align:top;color:#444">Gesamteindruck</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;font-size:1.3em">
            ${{ github.event.client_payload.gesamteindruck }}
            </td>
            </tr>

            <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;font-weight:bold;vertical-align:top;color:#444">👍 Was läuft gut?</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;white-space:pre-wrap">
            ${{ github.event.client_payload.gut }}
            </td>
            </tr>

            <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;font-weight:bold;vertical-align:top;color:#444">💡 Wünsche / Ideen</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;white-space:pre-wrap">
            ${{ github.event.client_payload.wunsch }}
            </td>
            </tr>

            <tr>
            <td style="padding:10px 0;border-bottom:1px solid #eee;font-weight:bold;vertical-align:top;color:#444">👎 Was gefällt nicht?</td>
            <td style="padding:10px 0;border-bottom:1px solid #eee;white-space:pre-wrap">
            ${{ github.event.client_payload.stoert }}
            </td>
            </tr>

            <tr>
            <td style="padding:10px 0;font-weight:bold;vertical-align:top;color:#444">👤 Name</td>
            <td style="padding:10px 0">
            ${{ github.event.client_payload.name }}
            </td>
            </tr>

            </table>

            <p style="margin:16px 0 0;padding-top:12px;border-top:1px solid #eee;color:#999;font-size:0.8rem">
            Eingegangen am ${{ github.event.client_payload.datum }}
            um ${{ github.event.client_payload.uhrzeit }} Uhr
            &nbsp;·&nbsp;
            Studjo Infoterminal
            &nbsp;·&nbsp;
            <a href="https://studjo-auq.github.io/terminal/" style="color:#b61f29">studjo-auq.github.io/terminal</a>
            </p>
            </div>
            </div>

