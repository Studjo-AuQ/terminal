name: Speiseplan-Kurztexte aktualisieren

on:
  push:
    paths:
      - 'speiseplaene/*.pdf'
      - '.github/workflows/speiseplan-kurz-update.yml'
  workflow_dispatch:

jobs:
  kurztexte-erzeugen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: OCR-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-deu
          python3 -m pip install --disable-pip-version-check pillow numpy

      - name: A1 und A2 aus Speiseplan-PDFs lesen
        run: |
          python3 << 'PYTHON'
          import json
          import re
          import subprocess
          import tempfile
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import numpy as np
          from PIL import Image

          ZIEL = Path('data/speiseplan-kurz.json')
          ZIEL.parent.mkdir(parents=True, exist_ok=True)

          # Bewusst vollständig neu aufbauen:
          # So bleiben keine früher falsch erkannten Tageswerte erhalten.
          tage = {}
          fehler = []

          WOCHENTAGE = (
              'montag', 'dienstag', 'mittwoch',
              'donnerstag', 'freitag', 'samstag', 'sonntag'
          )

          def gruppiere_linien(kandidaten):
              gruppen = []
              for pos in kandidaten:
                  if gruppen and pos - gruppen[-1][-1] <= 10:
                      gruppen[-1].append(pos)
                  else:
                      gruppen.append([pos])
              return [round(sum(g) / len(g)) for g in gruppen]

          def finde_raster(img):
              rgb = np.asarray(img.convert('RGB'), dtype=np.float32)
              grau = rgb.mean(axis=2)

              y_anteil = (grau[:, ::2] < 130).mean(axis=1)
              x_anteil = (grau[::2, :] < 130).mean(axis=0)

              ys = gruppiere_linien(np.where(y_anteil > 0.50)[0].tolist())
              xs = gruppiere_linien(np.where(x_anteil > 0.50)[0].tolist())
              return xs, ys

          def ocr_kurz(crop, tmpdir, name):
              pfad = Path(tmpdir) / f'{name}.png'
              crop.save(pfad)

              proc = subprocess.run(
                  ['tesseract', str(pfad), 'stdout', '-l', 'deu', '--psm', '6'],
                  check=False,
                  capture_output=True,
                  text=True,
              )

              text = proc.stdout or ''
              text = re.sub(r'\[[^\]]*\]', ' ', text)
              text = re.sub(r'kcal:?\s*\d+\s*\]?', ' ', text, flags=re.I)
              text = re.sub(r'[|_~]', ' ', text)
              text = re.sub(r'\s+', ' ', text).strip()

              woerter = re.findall(
                  r"[0-9A-Za-zÄÖÜäöüß][0-9A-Za-zÄÖÜäöüß&/.,+'’()\-]*",
                  text,
              )
              return ' '.join(woerter[:3]).strip()

          def ist_datumsspalte(text):
              """
              Die aktuelle PDF enthält links eine Tages-/Datumsspalte.
              Diese wurde bisher fälschlich als A1 gespeichert.
              """
              t = str(text or '').strip().lower()

              if any(re.search(rf'\b{tag}\b', t) for tag in WOCHENTAGE):
                  return True

              if re.search(r'\b\d{1,2}\.\d{1,2}\.\d{2,4}\b', t):
                  return True

              return False

          def waehle_a1_a2(werte):
              """
              OCR liest mehrere Tabellenzellen der Zeile.
              Falls die erste Zelle ein Wochentag/Datum ist, wird sie übersprungen.
              Danach sind die ersten zwei echten Menüzellen A1 und A2.
              """
              werte = [str(x or '').strip() for x in werte]

              if len(werte) >= 3 and ist_datumsspalte(werte[0]):
                  werte = werte[1:]

              if len(werte) < 2:
                  raise RuntimeError(
                      f'Zu wenige Menü-Zellen erkannt: {werte!r}'
                  )

              a1, a2 = werte[0], werte[1]

              if not a1 or not a2:
                  raise RuntimeError(
                      f'A1/A2 leer erkannt: A1={a1!r}, A2={a2!r}'
                  )

              # Ein grüner Workflow darf künftig niemals wieder
              # ein Datum oder einen Wochentag als Menü speichern.
              if ist_datumsspalte(a1) or ist_datumsspalte(a2):
                  raise RuntimeError(
                      f'Datums-/Wochentagstext in Menü erkannt: '
                      f'A1={a1!r}, A2={a2!r}'
                  )

              return a1, a2

          pdfs = sorted(Path('speiseplaene').glob('*.pdf'))

          if not pdfs:
              raise RuntimeError(
                  'Keine Speiseplan-PDFs unter speiseplaene/ gefunden.'
              )

          for pdf in pdfs:
              m = re.search(r'(\d{4})-KW(\d{1,2})', pdf.name, re.I)
              if not m:
                  print(f'ℹ️ Übersprungen – kein KW-Dateiname: {pdf.name}')
                  continue

              jahr = int(m.group(1))
              kw = int(m.group(2))

              try:
                  with tempfile.TemporaryDirectory() as tmpdir:
                      basis = Path(tmpdir) / 'seite1'

                      subprocess.run(
                          [
                              'pdftoppm',
                              '-f', '1',
                              '-singlefile',
                              '-png',
                              '-r', '300',
                              str(pdf),
                              str(basis),
                          ],
                          check=True,
                          capture_output=True,
                      )

                      bild = Image.open(str(basis) + '.png').convert('RGB')
                      xs, ys = finde_raster(bild)

                      if len(xs) < 4 or len(ys) < 7:
                          raise RuntimeError(
                              f'Tabellenraster nicht erkannt: '
                              f'X={len(xs)}, Y={len(ys)}'
                          )

                      neue_woche = {}

                      for tag_index in range(5):
                          datum = date.fromisocalendar(
                              jahr, kw, tag_index + 1
                          )
                          y0 = ys[1 + tag_index] + 6
                          y1 = ys[2 + tag_index] - 6

                          # Bis zu vier Zellen lesen:
                          # Tag/Datum | A1 | A2 | A3
                          # Falls die PDF keine separate Datumsspalte hat,
                          # funktioniert waehle_a1_a2() ebenfalls.
                          zellen_anzahl = min(4, len(xs) - 1)
                          werte = []

                          for spalte in range(zellen_anzahl):
                              x0 = xs[spalte] + 6
                              x1 = xs[spalte + 1] - 6

                              if x1 <= x0 or y1 <= y0:
                                  raise RuntimeError(
                                      f'Ungültiger Zellenausschnitt: '
                                      f'Spalte {spalte}'
                                  )

                              crop = bild.crop((x0, y0, x1, y1))
                              kurz = ocr_kurz(
                                  crop,
                                  tmpdir,
                                  f'{jahr}-KW{kw:02d}-'
                                  f'{tag_index}-{spalte}',
                              )
                              werte.append(kurz)

                          a1, a2 = waehle_a1_a2(werte)

                          neue_woche[datum.isoformat()] = {
                              'a1': a1,
                              'a2': a2,
                              'quelle': str(pdf).replace('\\', '/'),
                          }

                          print(
                              f'  {datum.isoformat()}: '
                              f'A1={a1!r} | A2={a2!r}'
                          )

                      tage.update(neue_woche)
                      print(
                          f'✅ {pdf.name}: A1/A2 für 5 Tage erkannt'
                      )

              except Exception as exc:
                  meldung = f'{pdf.name}: {exc}'
                  fehler.append(meldung)
                  print('❌', meldung)

          # Bei irgendeinem OCR-/Rasterfehler soll der Workflow ROT werden.
          # So wird keine semantisch fehlerhafte JSON-Datei als Erfolg verkauft.
          if fehler:
              raise RuntimeError(
                  'Mindestens ein Speiseplan konnte nicht sicher '
                  'ausgewertet werden:\n' + '\n'.join(fehler)
              )

          if not tage:
              raise RuntimeError('Keine Tages-Einträge erzeugt.')

          jetzt = datetime.now(ZoneInfo('Europe/Berlin'))

          ausgabe = {
              'schemaVersion': 2,
              'stand': jetzt.strftime('%d.%m.%Y, %H:%M Uhr'),
              'hinweis': (
                  'Automatisch aus den Speiseplan-PDFs erzeugt. '
                  'Eine erkannte Tages-/Datumsspalte wird übersprungen. '
                  'A1 und A2 werden auf jeweils drei Wörter gekürzt.'
              ),
              'tage': dict(sorted(tage.items())),
              'fehler': [],
          }

          ZIEL.write_text(
              json.dumps(
                  ausgabe,
                  ensure_ascii=False,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )

          print(
              f'✅ {ZIEL} geschrieben: {len(tage)} Tages-Einträge'
          )
          PYTHON

      - name: Kurztexte ins Repository übertragen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/speiseplan-kurz.json
          git diff --staged --quiet || git commit -m "Speiseplan-Kurztexte automatisch aktualisiert"
          git push
