<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kein Internet – Studjo Terminal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b61f29">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studjo">
<style>
  :root { --primary-red: #b61f29; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Nunito Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
    background: #f9f9f9;
    color: #0f2f37;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
  }
  .symbol {
    font-size: 4rem;
    margin-bottom: 8px;
    line-height: 1;
  }
  h1 {
    color: var(--primary-red);
    font-size: 1.6rem;
    margin: 0 0 12px;
  }
  p {
    font-size: 1.15rem;
    line-height: 1.5;
    max-width: 420px;
    margin: 0 0 28px;
  }
  button {
    font-size: 1.1rem;
    font-weight: 800;
    color: #fff;
    background: var(--primary-red);
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    cursor: pointer;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
  <div class="symbol" aria-hidden="true">📶</div>
  <h1>Kein Internet gerade</h1>
  <p>
    Diese Seite braucht Internet.<br>
    Bitte versuche es gleich noch einmal.
  </p>
  <button type="button" onclick="location.reload()">Noch einmal versuchen</button>

  <script src="gong.js"></script>
</body>
</html>
