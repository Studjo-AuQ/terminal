<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Losung für heute | Studjo Terminal</title>
<link rel="stylesheet" href="style.css">

<style>

/* ══ LOSUNG-SEITE ══ */
.losung-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 10px 40px;
}

.losung-card {
  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10);
  padding: 40px 30px 30px;
  text-align: center;
}

.losung-datum {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--secondary-grey, #8a8d8f);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 30px;
}

.losung-block {
  margin-bottom: 40px;
}

.losung-label {
  font-size: 0.85rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--primary-red, #b61f29);
  margin-bottom: 14px;
}

.losung-text {
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1.5;
  color: var(--text-color, #0f2f37);
  margin-bottom: 14px;
}

.lehrtext-text {
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1.55;
  color: var(--text-color, #0f2f37);
  margin-bottom: 14px;
}

.losung-stelle {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--secondary-grey, #8a8d8f);
}

.losung-trenner {
  width: 60px;
  height: 4px;
  background: var(--primary-red, #b61f29);
  border-radius: 2px;
  margin: 0 auto 40px;
  opacity: 0.5;
}

.losung-copyright {
  font-size: 0.85rem;
  color: var(--secondary-grey, #8a8d8f);
  margin-top: 10px;
  line-height: 1.6;
}

.losung-copyright a {
  color: var(--primary-red, #b61f29);
  font-weight: 700;
  text-decoration: underline;
}

.losung-sonntag {
  font-size: 1rem;
  font-weight: 600;
  color: var(--primary-red, #b61f29);
  margin-top: -22px;
  margin-bottom: 24px;
}

.losung-topbar {
  max-width: 900px;
  margin: 0 auto 30px;
  padding: 10px 10px 0;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.zurueck-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #ffffff;
  color: var(--primary-red, #b61f29);
  font-weight: 800;
  font-size: 1rem;
  text-decoration: none;
  padding: 10px 22px;
  border-radius: 30px;
  border: 2px solid var(--primary-red, #b61f29);
  transition: background-color 0.2s, color 0.2s, transform 0.2s;
  white-space: nowrap;
}

.zurueck-pill:hover {
  background-color: var(--primary-red, #b61f29);
  color: #ffffff;
  transform: translateY(-1px);
}

.losung-topbar h1 {
  margin: 0;
  text-align: left;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
}

.losung-icon {
  font-size: 1.5rem;
}

.losung-status {
  text-align: center;
  font-size: 1.1rem;
  color: var(--secondary-grey, #8a8d8f);
  padding: 60px 10px;
}

@media (max-width: 600px) {
  .losung-text   { font-size: 1.4rem; }
  .lehrtext-text { font-size: 1.15rem; }
  .losung-card   { padding: 26px 18px 22px; }
}

</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="header.jpg" alt="Studjo Logo">
  </div>
</header>

<main id="scrollable-content">

  <div class="losung-topbar">
    <a href="index.html" class="zurueck-pill">← Zurück</a>
    <h1><span class="losung-icon">📖</span> Losung für heute</h1>
  </div>

  <div class="losung-wrap">
    <div id="losung-inhalt" class="losung-status">Losung wird geladen …</div>
  </div>

</main>

<script>
(function () {

  const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch',
                      'Donnerstag','Freitag','Samstag'];
  const MONATE = ['Januar','Februar','März','April','Mai','Juni',
                  'Juli','August','September','Oktober','November','Dezember'];

  // Heutiges Datum als "YYYY-MM-DD" (lokale Zeit, kein UTC-Versatz)
  function heutigerSchluessel() {
    const heute = new Date();
    const jahr = heute.getFullYear();
    const monat = String(heute.getMonth() + 1).padStart(2, '0');
    const tag = String(heute.getDate()).padStart(2, '0');
    return jahr + '-' + monat + '-' + tag;
  }

  function formatDatum(isoDatum) {
    const teile = String(isoDatum).split('-');
    if (teile.length !== 3) return isoDatum;
    const d = new Date(Number(teile[0]), Number(teile[1]) - 1, Number(teile[2]));
    if (isNaN(d.getTime())) return isoDatum;
    return WOCHENTAGE[d.getDay()] + ', ' + d.getDate() + '. ' +
           MONATE[d.getMonth()] + ' ' + d.getFullYear();
  }

  function zeigeFehler(text) {
    const ziel = document.getElementById('losung-inhalt');
    ziel.classList.add('losung-status');
    ziel.textContent = text;
  }

  fetch('data/losungen.json', { cache: 'no-store' })
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(alleLosungen => {
      const schluessel = heutigerSchluessel();
      const data = alleLosungen[schluessel];

      if (!data) {
        zeigeFehler('Für den heutigen Tag (' + formatDatum(schluessel) +
                     ') liegt noch keine Losung vor.');
        return;
      }

      const ziel = document.getElementById('losung-inhalt');
      ziel.classList.remove('losung-status');

      const sonntagHtml = data.sonntag
        ? '<div class="losung-sonntag">' + data.sonntag + '</div>'
        : '';

      ziel.innerHTML =
        '<div class="losung-card">' +
          '<div class="losung-datum">' + formatDatum(schluessel) + '</div>' +
          sonntagHtml +

          '<div class="losung-block">' +
            '<div class="losung-label">Losung</div>' +
            '<div class="losung-text">' + data.losung + '</div>' +
            '<div class="losung-stelle">' + data.losung_stelle + '</div>' +
          '</div>' +

          '<div class="losung-trenner"></div>' +

          '<div class="losung-block" style="margin-bottom:20px;">' +
            '<div class="losung-label">Lehrtext</div>' +
            '<div class="lehrtext-text">' + data.lehrtext + '</div>' +
            '<div class="losung-stelle">' + data.lehrtext_stelle + '</div>' +
          '</div>' +

          '<div class="losung-copyright">' +
            '© Evangelische Brüder-Unität – Herrnhuter Brüdergemeine' +
            ' (<a href="https://www.herrnhuter.de" target="_blank" rel="noopener">www.herrnhuter.de</a>)' +
            '<br>' +
            'Weitere Informationen finden Sie hier: ' +
            '<a href="https://www.losungen.de" target="_blank" rel="noopener">www.losungen.de</a>' +
          '</div>' +
        '</div>';
    })
    .catch(err => {
      console.error('Losungen konnten nicht geladen werden:', err);
      zeigeFehler('Die Losung für heute konnte leider nicht geladen werden.');
    });

})();
</script>

<link rel="stylesheet" href="a11y.css">
<script src="a11y.js"></script>
</body>
</html>
