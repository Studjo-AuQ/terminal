<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B1E24"><title>Raus aus der Gewaltspirale | Studjo-Terminal</title>
<style>
:root{--red:#8B1E24;--bg:#f7f5f3;--ink:#233039}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header{background:#fff;border-bottom:4px solid var(--red);padding:9px clamp(10px,2.4vw,23px);display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;text-decoration:none;font-size:.9rem;line-height:1.3;font-weight:800;min-height:48px;border:2px solid var(--red);border-radius:99px;padding:8px 14px;color:var(--red);background:white}
.back:focus-visible,button:focus-visible{outline:3px solid #e5b525;outline-offset:3px}
header img{max-width:39%;height:37px;object-fit:contain}
main{display:flex;flex:1;min-height:0;flex-direction:column}.note{padding:7px 12px;text-align:center;font-size:.84rem;line-height:1.35;background:#fff8e9;color:#4d4030;border-bottom:1px solid #e5d4ac}
iframe{flex:1;border:0;background:white;width:100%;min-height:78vh;min-height:78dvh}
footer{text-align:center;background:var(--red);color:white;padding:7px 10px;font-size:.78rem}
@media(max-width:500px){header img{height:29px}.back{font-size:.81rem;padding:7px 10px}}
.note[hidden]{display:none!important}
</style></head><body>
<header><a href="../verhaltenbeikonflikten.html" target="_self" data-direct-link class="back">← Zurück zum Gewaltschutz</a><img src="../img/header.jpg" alt="Studjo – Arbeit und Qualifizierung"></header>
<main><div class="note" id="studjo-start-note" role="note">Kein Speichern. Plane genügend Zeit für eine Spielrunde ein.</div><iframe id="studjo-game-frame" title="Raus aus der Gewaltspirale" src="gewaltspirale-spiel.html" loading="eager" sandbox="allow-scripts allow-modals" allow="fullscreen" allowfullscreen></iframe></main>
<footer>© Studjo · Evangelisches Johanneswerk · 🎲 Eigenes Lernspiel · ohne Spielstand-Speicherung</footer>

<script>
// Gelber Hinweis nur bis zum erfolgreichen Spielstart.
// Die sandbox-isolierte Spielseite meldet den Start per postMessage.
(function(){
 'use strict';
 const frame=document.getElementById('studjo-game-frame');
 const note=document.getElementById('studjo-start-note');
 window.addEventListener('message',function(event){
  const data=event.data;
  if(event.source!==frame.contentWindow) return;
  if(!data||data.type!=='studjo:game-started'||data.game!=='gewaltspirale') return;
  note.hidden=true;
 });
})();
</script>
</body></html>
