const STORE_LEGACY='studjo_grenzenkompass_prototyp_v1';
const STORE_ROUND='studjo_grenzenkompass_v1_round';
const STORE_ALL='studjo_grenzenkompass_v1_gesamt';
const LAST_MODE='studjo_grenzenkompass_v1_lastmode';
function storageKey(mode){return mode==='all'?STORE_ALL:STORE_ROUND;}
const EMOJI_PREF='studjo_grenzenkompass_emoji_pref';
const DEVICE_PREF='studjo_grenzenkompass_terminal_device_v1';
const kioskLocked=new URLSearchParams(location.search).get('kiosk')==='1';
// No browser storage is accessed for game data before explicit private-device opt-in.
let deviceMode=kioskLocked?'shared':null;
let emojiVisible=true;
function isPrivate(){return deviceMode==='private';}
function chooseDevice(mode){
 if(kioskLocked && mode!=='shared')return;
 if(mode!=='private'&&mode!=='shared')return;
 state=null;deviceMode=mode;ioError='';emojiVisible=true;
 if(isPrivate()){
  try{localStorage.setItem(DEVICE_PREF,'private');emojiVisible=localStorage.getItem(EMOJI_PREF)!=='off';}
  catch(e){ioError='Die Speicherung ist in diesem Browser nicht verfügbar. Du kannst deinen Fortschritt nur während dieser Sitzung behalten.';}
 }else{
  // Shared mode: neither read nor write any stored game state.
 }
 renderHome();
}

const COMPANION=['','😟','🙁','😐','🙂','😊','😄'];
function firstAttempts(){if(!state||!Array.isArray(state.firstAttempts))return [];return state.firstAttempts.filter(x=>x===true||x===false);}
function companionLevel(){const a=firstAttempts(),right=a.filter(Boolean).length;return Math.max(1,Math.min(6,Math.round(1+5*(1+right)/(2+a.length))));}
function companionWidget(finished=false){if(!emojiVisible||!state)return '';const level=finished?6:companionLevel();return `<div class="companion" role="img" aria-label="${finished?'Lern-Begleiter: Gut gemacht, Runde abgeschlossen':`Lern-Begleiter: Gesichtsausdruck ${level} von 6`}"><span class="companion-face" aria-hidden="true">${COMPANION[level]}</span><span class="companion-label">${finished?'Runde geschafft':'Lern-Begleiter'}</span></div>`;}

let state=null;
let ioError='';
const app=document.getElementById('app');
const importfile=document.getElementById('importfile');
function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){let r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function randMode(mode){
 const ids=CARDS.map(c=>c.card);
 if(mode==='all'){
  // Das Gesamtspiel verwendet ausnahmslos die feste Reihenfolge 1A, 1B, 1C, ... 52C.
  return ids.slice().sort((a,b)=>a-b).flatMap(id=>['A','B','C'].map(type=>({card:id,type})));
 }
 const selected=shuffle(ids).slice(0,9);
 let tasks;
 do{tasks=shuffle(['A','A','A','B','B','B','C','C','C']);}
 while(tasks.some((t,i)=>i>=3 && t===tasks[i-1] && t===tasks[i-2] && t===tasks[i-3]));
 return selected.map((id,i)=>({card:id,type:tasks[i]}));
}
function save(){
 if(!isPrivate())return;
 try{
  if(state){
   localStorage.setItem(storageKey(state.mode),JSON.stringify(state));
   localStorage.setItem(LAST_MODE,state.mode);
  }
 }catch(err){ioError='Automatisches Speichern ist auf diesem Gerät nicht verfügbar. Du kannst den Spielstand als JSON speichern.';}
}
function load(mode){
 if(!isPrivate())return (state&&state.mode===mode)?state:null;
 try{
  let str=localStorage.getItem(storageKey(mode));
  // Eine angefangene Neuner-Runde aus Version 0.5 bleibt nutzbar.
  if(!str&&mode==='round'){
   const old=localStorage.getItem(STORE_LEGACY);
   if(old){const legacy=JSON.parse(old);if(legacy.mode==='round'&&valid(legacy)){
    str=old;localStorage.setItem(STORE_ROUND,old);
   }}
  }
  if(!str)return null;
  const parsed=JSON.parse(str);
  if(valid(parsed)&&parsed.mode===mode)return parsed;
 }catch(err){}
 return null;
}
function valid(v){
 if(!v || v.version!==1 || !Array.isArray(v.queue) || !['round','all'].includes(v.mode))return false;
 if((v.mode==='round'?v.queue.length!==9:v.queue.length!==CARDS.length*3)||
    !Number.isInteger(v.index)||v.index<0||v.index>v.queue.length)return false;
 if(!Array.isArray(v.done)||v.done.length!==v.queue.length||v.done.some(x=>typeof x!=='boolean'))return false;
 if(v.firstAttempts!==undefined&&(!Array.isArray(v.firstAttempts)||v.firstAttempts.length!==v.queue.length||v.firstAttempts.some(x=>x!==null&&typeof x!=='boolean')))return false;
 const validCards=new Set(CARDS.map(c=>c.card));
 if(!v.queue.every(q=>q&&validCards.has(q.card)&&['A','B','C'].includes(q.type)))return false;
 if(v.mode==='round'){
  if(new Set(v.queue.map(q=>q.card)).size!==9)return false;
  if(['A','B','C'].some(t=>v.queue.filter(q=>q.type===t).length!==3))return false;
 }else{
  const ids=CARDS.map(c=>c.card).sort((a,b)=>a-b);
  if(!v.queue.every((q,i)=>q.card===ids[Math.floor(i/3)]&&q.type==='ABC'[i%3]))return false;
 }
 return true;
}
function start(mode){
 const previous=load(mode);
 if(previous&&previous.index<previous.queue.length && !confirm('Für diesen Modus gibt es einen angefangenen Spielstand. Wenn du neu beginnst, wird dieser ersetzt. Möchtest du neu beginnen?'))return;
 const queue=randMode(mode);
 state={version:1,mode,queue,index:0,done:Array(queue.length).fill(false),firstAttempts:Array(queue.length).fill(null),currentChoice:null,wrongCount:0,created:new Date().toISOString()};
 save();render();
}
function setChoice(i){stopSpeech();if(!state || state.index>=state.queue.length||state.done[state.index])return;
 const q=getCurrent().task;if(i<0||i>2)return;
 if(!Array.isArray(state.firstAttempts))state.firstAttempts=Array(state.queue.length).fill(null);
  if(state.firstAttempts[state.index]===null)state.firstAttempts[state.index]=(i===q.correct);
  state.currentChoice=i;if(i!==q.correct){state.wrongCount++;}else{state.done[state.index]=true;}
 save();render();}
function getCurrent(){const q=state.queue[state.index],card=CARDS.find(c=>c.card===q.card);return{card,variant:q.type,task:card.tasks[q.type]};}
function next(){
 if(!state ||!state.done[state.index])return;
 state.index++;state.currentChoice=null;
 if(state.index>=state.queue.length){
  state.completedAt=state.completedAt||new Date().toISOString();
 }
 save();
 if(state.completedAt && window.GrenzenLMS)window.GrenzenLMS.complete(state.mode,state.queue.length);
 render();
}
function previous(){if(!state||state.index<=0)return;state.index--;state.currentChoice=state.done[state.index]?getCurrent().task.correct:null;save();render();}
function retry(){if(!state||state.done[state.index])return;state.currentChoice=null;save();render();}
function reviewAgain(){if(!state||state.index>=state.queue.length)return;state.done[state.index]=false;state.currentChoice=null;save();render();}
function home(){renderHome();}
function render(){if(!state){renderHome();return;}if(state.index>=state.queue.length){renderFinish();return;}renderTask();}

// Browser-native speech. Prefer locally installed German voices for offline use.
const VOICE_AVAILABLE=typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
let currentSpeechToken=0;let isReading=false;let currentUtterance=null;let voiceIssue='';
function clearSpeechMarks(){app.querySelectorAll('.reading-now').forEach(e=>e.classList.remove('reading-now'));}
function stopSpeech(){currentSpeechToken++;isReading=false;clearSpeechMarks();if(VOICE_AVAILABLE){try{window.speechSynthesis.cancel();}catch(e){}}currentUtterance=null;const status=app.querySelector('[data-voice-status]');if(status)status.textContent='Vorlesen angehalten.';}
function speechVoice(){if(!VOICE_AVAILABLE)return null;let voices=[];try{voices=window.speechSynthesis.getVoices();}catch(e){}return voices.filter(v=>/^de(-|$)/i.test(v.lang)).sort((a,b)=>Number(!!b.localService)-Number(!!a.localService))[0]||null;}
function voiceButton(action,text,cls=''){return `<button type="button" class="voicebutton ${cls}" data-action="${action}" ${VOICE_AVAILABLE?'':'disabled title="Vorlesen ist in diesem Browser nicht verfügbar."'}>${text}</button>`;}
function voiceBar(type='task',extra=false,hasFeedback=false){let buttons=[];
 if(type==='home'){buttons=[voiceButton('speak-intro','🔊 Start-Text vorlesen'),voiceButton('speak-guide','🔊 Anleitung vorlesen')];}
 else if(type==='finish'){buttons=[voiceButton('speak-finish','🔊 Abschluss vorlesen')];}
 else {buttons=[voiceButton('speak-all','🔊 Alles vorlesen'),voiceButton('speak-story','🔊 Situation'),voiceButton('speak-question','🔊 Frage und Antworten')];if(extra)buttons.push(voiceButton('speak-extra','🔊 Fortsetzung'));if(hasFeedback)buttons.push(voiceButton('speak-feedback','🔊 Rückmeldung'));}
 buttons.push(voiceButton('stop-speech','■ Stopp','stop'));
 return `<div class="voicebar" role="group" aria-label="Vorlesefunktionen">${buttons.join('')}</div><p class="voice-status" data-voice-status aria-live="polite">${VOICE_AVAILABLE?'Tippe auf Vorlesen. Der gelbe Text wird gerade vorgelesen.':'Vorlesen wird in diesem Browser nicht unterstützt.'}</p>`;
}
function speakable(text){const parts=String(text||'').replace(/\n/g,' ').split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ„“])/u).map(x=>x.trim()).filter(Boolean);return parts.map(x=>`<span class="read-segment" data-read-segment>${html(x)}</span>`).join(' ');}
function speakGroup(which){
 if(!VOICE_AVAILABLE){const e=app.querySelector('[data-voice-status]');if(e)e.textContent='Dein Browser kann leider nicht vorlesen.';return;}
 stopSpeech();
 if(which==='guide'){const d=app.querySelector('details.help');if(d)d.open=true;}
 const selector=which==='all'?'[data-read-segment]':`[data-read-group="${which}"] [data-read-segment]`;
 const elements=Array.from(app.querySelectorAll(selector)).filter(x=>x.textContent.trim());
 if(!elements.length){const el=app.querySelector('[data-voice-status]');if(el)el.textContent='Hier gibt es gerade keinen Text zum Vorlesen.';return;}
 const token=++currentSpeechToken;isReading=true;
 const voice=speechVoice();const local=voice&&voice.localService;
 const info=app.querySelector('[data-voice-status]');if(info)info.textContent=voice?(local?'Vorlesen mit deutscher Stimme vom Gerät.':'Vorlesen mit deutscher Stimme. Offline nur mit installierter Offline-Stimme zuverlässig.'):'Vorlesen mit der Stimme deines Geräts. Offline-Stimme gegebenenfalls in Android-Einstellungen laden.';
 function run(i){if(token!==currentSpeechToken)return;clearSpeechMarks();if(i>=elements.length){isReading=false;currentUtterance=null;if(info)info.textContent='Vorlesen beendet.';return;}
  const el=elements[i];el.classList.add('reading-now');
  try{const ut=new SpeechSynthesisUtterance(el.textContent.trim());currentUtterance=ut;ut.lang='de-DE';ut.rate=0.88;ut.pitch=1;ut.volume=1;if(voice)ut.voice=voice;
   ut.onend=()=>{if(token===currentSpeechToken)run(i+1);};
   ut.onerror=(ev)=>{if(token===currentSpeechToken){clearSpeechMarks();isReading=false;if(info)info.textContent='Die Sprachausgabe hat nicht funktioniert. Bitte prüfe die deutschen Stimmen auf deinem Gerät.';}};
   window.speechSynthesis.speak(ut);
  }catch(err){clearSpeechMarks();isReading=false;if(info)info.textContent='Vorlesen ist auf diesem Gerät gerade nicht möglich.';}
 }
 run(0);
}

function renderHome(){
 stopSpeech();
 if(!deviceMode){renderDeviceSelection();return;}
 const round=load('round'),all=load('all');
 const resumable=(s)=>s&&s.index<s.queue.length;

 app.innerHTML=`<section class="home panel"><div class="hero"><p class="eyebrow">Verstehen · Handeln · Rücksicht nehmen</p><h1>Grenzen-Kompass 🧭</h1><p class="hero-tagline">Was ist jetzt richtig?</p><p class="lead">Grenzen erkennen. Gut handeln. Es besser machen.</p></div><div class="homebody"><div data-read-group="intro" class="read-intro"><p data-read-segment><strong>Du bekommst kurze Geschichten aus der Werkstatt.</strong></p><p data-read-segment>Schau dir das Bild an und wähle eine Antwort.</p><p data-read-segment>Du darfst es noch einmal versuchen.</p></div>${voiceBar('home')}<div class="paths"><div class="path a"><span class="pathicon">🔎</span><strong>A · Grenzen erkennen</strong><small>Was ist hier wichtig?</small></div><div class="path b"><span class="pathicon">✋</span><strong>B · Richtig handeln</strong><small>Was mache ich jetzt?</small></div><div class="path c"><span class="pathicon">🤝</span><strong>C · Besser machen</strong><small>Wie geht es besser?</small></div></div><h2 class="mode-title">Wähle dein Spiel</h2><div class="mode-grid"><section class="mode-tile"><h3>Kurze Runde</h3><p>9 verschiedene Karten. Die Aufgaben A, B und C kommen gemischt.</p><div class="mode-actions"><button class="btn primary" data-action="start-round">▶ Neue Runde mit 9 Aufgaben</button>${resumeRound}${roundInfo}</div></section><section class="mode-tile"><h3>Gesamtspiel</h3><p>Alle 52 Karten. Bei jeder Karte kommen A, dann B und dann C. Immer von Karte 1 bis Karte 52.</p><div class="mode-actions"><button class="btn primary" data-action="start-all">▶ Gesamtspiel mit 156 Aufgaben</button>${resumeAll}${allInfo}</div></section></div><div class="notice"><strong>Studjo-Terminal-Version 1.1:</strong> ${isPrivate()?'Auf deinem privaten Gerät werden beide Spielarten getrennt gespeichert.':'Gemeinsames Gerät: Es wird kein Spielstand dauerhaft gespeichert. Bitte beende das Spiel vor der nächsten Person.'}</div>${ioError?`<div class="notice" role="status">${html(ioError)}</div>`:''}<details class="help"><summary>ℹ️ Kurze Anleitung anzeigen</summary><div data-read-group="guide" class="read-guide"><p data-read-segment>1. Wähle die kurze Runde oder das Gesamtspiel.</p><p data-read-segment>2. Lies die Geschichte. Sieh dir das Bild an.</p><p data-read-segment>3. Wähle eine von drei Antworten.</p><p data-read-segment>4. Lies die Rückmeldung. Du darfst es noch einmal versuchen.</p><p data-read-segment>5. Gehe zur nächsten Aufgabe.</p><p data-read-segment>Im Gesamtspiel kommen die Karten von 1 bis 52. Jede Karte hat drei Aufgaben: A, B und C.</p><p data-read-segment>Beide Spielarten kannst du jederzeit unterbrechen und später fortsetzen.</p><p data-read-segment>Tippe auf Vorlesen. Der Text mit dem gelben Hintergrund wird gerade gesprochen.</p></div></details><p class="voice-small-note">🔊 Das Vorlesen nutzt die Stimmen deines Geräts. Für das Vorlesen ohne Internet muss eine deutsche Offline-Stimme installiert sein.</p><div class="companion-settings"><span class="companion-preview" aria-hidden="true">🙂</span><div class="companion-settings-text"><strong>Optionaler Lern-Begleiter</strong><span>Ein Gesicht verändert sich beim Üben. Du kannst es ausblenden. Es gibt keine Note.</span></div><button class="tool" data-action="emoji" aria-pressed="${emojiVisible}">${emojiVisible?'Gesicht ausblenden':'Gesicht anzeigen'}</button></div><div class="tools">${isPrivate()?`<button class="tool" data-action="import">📂 Spielstand laden (JSON)</button><button class="tool" data-action="export-round" ${round?'':'disabled'}>💾 Neuner-Runde als JSON</button><button class="tool" data-action="export-all" ${all?'':'disabled'}>💾 Gesamtspiel als JSON</button>`:''}${!kioskLocked?`<button class="tool" data-action="switch-device">⚙️ Gerät wechseln</button>`:''}${isPrivate()?`<button class="tool" data-action="delete-data">🗑️ Meine gespeicherten Spielstände löschen</button>`:''}<span class="smallprint">Keine Internetverbindung für die Spielinhalte erforderlich</span></div></div></section>`;
}
function renderTask(){stopSpeech();const{card,variant,task}=getCurrent(),n=state.index+1,total=state.queue.length,done=state.done[state.index],answered=state.currentChoice!==null,ok=done;
 const story=(card.story||card.original).replace(/\. /g,'.\n');
 const extra=task.extra?`<div class="extra" data-read-group="extra"><strong>➕ So geht die Geschichte weiter:</strong><p>${speakable(task.extra)}</p></div>`:'';
 const opts=task.options.map((o,i)=>{const chosen=state.currentChoice===i,right=done&&i===task.correct;return`<button type="button" class="choice ${chosen?'chosen':''} ${right?'right':''}" data-answer="${i}" aria-pressed="${chosen?'true':'false'}" ${done?'disabled':''}><span class="letter">${right?'✓':i+1}</span><span class="read-segment" data-read-segment>${html(o)}</span></button>`;}).join('');
 const fb=answered?`<div class="feedback ${ok?'ok':'again'}" role="status" aria-live="polite" data-read-group="feedback"><h3><span class="read-segment" data-read-segment>${ok?'Gut erkannt!':'Das passt noch nicht.'}</span></h3><p>${speakable(task.feedback[state.currentChoice])}</p>${ok?`<div class="learning"><strong>Merke:</strong> ${speakable(task.takeaway)}</div>`:''}</div>`:'';
 const buttons=`<div class="gamebuttons"><button class="btn outline" data-action="back" ${state.index===0?'disabled':''}>← Zurück</button>${answered&&!ok?`<button class="btn warn" data-action="retry">↻ Andere Antwort wählen</button>`:''}${ok?`<button class="btn primary" data-action="next">${state.index===total-1?(state.mode==='all'?'Gesamtspiel abschließen ✓':'Runde abschließen ✓'):'Weiter →'}</button><button class="btn plain" data-action="change">Antwort ändern</button>`:''}</div>`;
 const typeHeader='Karte';
 app.innerHTML=`<div class="gamehead"><span class="counter">Aufgabe ${n} von ${total}</span><div class="topactions">${voiceButton('speak-all','🔊 Vorlesen')} ${companionWidget()}<button class="tool emoji-switch" data-action="emoji" aria-pressed="${emojiVisible}" title="Lern-Begleiter ein- oder ausblenden">${emojiVisible?'Gesicht aus':'Gesicht an'}</button>${isPrivate()?`<button class="tool" data-action="export" title="Spielstand als JSON speichern">💾 Speichern</button>`:''}<button class="tool" data-action="menu">${isPrivate()?'⏸ Pause':'✕ Spiel beenden'}</button></div></div><div class="progressouter" role="progressbar" aria-valuenow="${state.done.filter(Boolean).length}" aria-valuemax="${total}" aria-valuemin="0" aria-label="Bearbeitete Aufgaben"><div class="progressinner" style="width:${Math.round(state.done.filter(Boolean).length/total*100)}%"></div></div><article class="questionpanel panel"><div class="questiontop"><span class="typebadge ${variant}">${LABELS[variant].icon} ${variant} · ${LABELS[variant].title}</span><span class="cardno">${typeHeader} ${card.card} · ${html(card.topic)}</span></div><section class="situation"><div><p class="blocktag">Situation</p><p class="situationtitle">${html(card.label)}</p><div data-read-group="story"><p class="story">${speakable(story)}</p></div>${extra}</div><div class="artbox"><img alt="Bild aus Karte ${card.card}: ${html(card.label)}" src="${PICTURES[card.picture]}" loading="eager" draggable="false"></div></section><div class="qbody"><h2 id="question-title" tabindex="-1" data-read-group="question"><span class="read-segment" data-read-segment>${html(task.question)}</span></h2><div class="choices" data-read-group="question" aria-label="Drei Antworten">${opts}</div>${voiceBar('task',!!task.extra,answered)}${fb}${buttons}</div><div class="footnote">🧭 Es gibt keine Strafpunkte. Bei einer unpassenden Antwort darfst du erneut wählen. ${task.extra?'Die neue Geschichte gehört nur zu dieser Aufgabe.':''}</div></article><p class="smallprint">${ioError?html(ioError):(isPrivate()?"Dein Fortschritt wird nach jeder Antwort auf diesem privaten Gerät gespeichert.":"Gemeinsames Gerät: Keine Speicherung. Beim Beenden oder Schließen geht der Fortschritt verloren.")}</p>`;
}
function renderFinish(){stopSpeech();const total=state.queue.length;app.innerHTML=`<section class="panel complete"><div class="bigicon" aria-hidden="true">🎉</div><p class="eyebrow">${state.mode==='all'?'Dein Gesamtspiel ist geschafft':'Deine Runde ist geschafft'}</p><h1>Gut gemacht!</h1><div data-read-group="finish"><p data-read-segment>Du hast ${total} Aufgaben bearbeitet.</p><p data-read-segment>Du weißt jetzt mehr über Grenzen.</p><p data-read-segment>Du kannst andere Menschen fragen.</p><p data-read-segment>Und du kannst Hilfe holen.</p></div>${voiceBar('finish')}<div class="stars" aria-hidden="true">${'<span>★</span>'.repeat(5)}</div>${emojiVisible?`<div class="finish-companion">${companionWidget(true)}</div>`:''}<div class="notice">Du hast ohne Strafpunkte gelernt. Auch das Wiederholen ist ein Teil des Lernens.</div>${window.GrenzenLMS?`<p class="lms-result" role="status">${html(window.GrenzenLMS.message())}</p>`:''}<div class="actions"><button class="btn primary" data-action="start-round">Neue Runde starten →</button><button class="btn outline" data-action="start-all">Neues Gesamtspiel starten</button>${isPrivate()?`<button class="btn outline" data-action="export">💾 Ergebnis / Spielstand speichern</button>`:""}${window.GrenzenLMS?'<button class="btn outline" data-action="lms-retry">↻ LMS-Abschluss melden</button>':''}<button class="btn plain" data-action="menu">Zur Startseite</button></div></section>`;}
function exportState(mode){if(!isPrivate()){alert('Auf gemeinsam genutzten Geräten ist der Download von Spielständen aus Datenschutzgründen deaktiviert.');return;}const s=mode?load(mode):(state||load(localStorage.getItem(LAST_MODE)==='all'?'all':'round'));if(!s){alert('Es gibt noch keinen Spielstand.');return;}const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='grenzen-kompass-'+(s.mode==='all'?'gesamtspiel':'neuner-runde')+'-spielstand.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function importState(file){if(!isPrivate())return;if(!file)return;if(file.size>1e6){alert('Die Datei ist zu groß.');return;}const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(String(reader.result));if(!valid(obj))throw Error('Falscher Dateiaufbau');state=obj;if(!Array.isArray(state.firstAttempts))state.firstAttempts=Array(state.queue.length).fill(null);save();render();}catch(err){alert('Diese Datei ist kein gültiger Grenzen-Kompass-Spielstand.');}};reader.onerror=()=>alert('Die Datei konnte nicht gelesen werden.');reader.readAsText(file);}
function doAction(action){
 if(action==='device-private'){chooseDevice('private');return;}
 if(action==='device-shared'){chooseDevice('shared');return;}
 if(action==='switch-device'){
  if(!kioskLocked && confirm('Gerät wechseln? Ein nicht gespeicherter Spielstand wird beendet.')){
   state=null;deviceMode=null;try{localStorage.removeItem(DEVICE_PREF);}catch(e){}renderHome();
  }return;
 }
 if(action==='delete-data'){
  if(isPrivate()&&confirm('Deine gespeicherten Grenzen-Kompass-Spielstände auf diesem Gerät wirklich löschen?')){
   try{[STORE_LEGACY,STORE_ROUND,STORE_ALL,LAST_MODE].forEach(k=>localStorage.removeItem(k));}catch(e){}
   state=null;renderHome();
  }return;
 }
 if(action==='menu'&&!isPrivate()){
  if(state&&!confirm('Spiel ohne Speichern beenden? Dein Fortschritt geht verloren.'))return;
  state=null;renderHome();return;
 }
 if(action==='stop-speech'){stopSpeech();return;}if(action.startsWith('speak-')){speakGroup(action.slice(6));return;}stopSpeech();switch(action){case'start-round':start('round');break;case'start-all':start('all');break;case'resume-round':case'resume-all':state=load(action==='resume-all'?'all':'round');if(state&&!Array.isArray(state.firstAttempts))state.firstAttempts=Array(state.queue.length).fill(null);render();break;case'next':next();break;case'back':previous();break;case'retry':retry();break;case'change':reviewAgain();break;case'menu':home();break;case'export':exportState();break;case'lms-retry':if(window.GrenzenLMS && state&&state.completedAt){window.GrenzenLMS.complete(state.mode,state.queue.length);renderFinish();}break;case'export-round':exportState('round');break;case'export-all':exportState('all');break;case'import':importfile.click();break;case'emoji':emojiVisible=!emojiVisible;if(isPrivate())try{localStorage.setItem(EMOJI_PREF,emojiVisible?'on':'off');}catch(e){}if(app.querySelector('.home'))renderHome();else render();break;}}
// Native browser click works on Chrome Android, Firefox Desktop, touchscreens, keyboards, and mouse; no touchend/preventDefault hacks.
app.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t||t.disabled||!app.contains(t))return;if(t.hasAttribute('data-answer')){setChoice(Number(t.getAttribute('data-answer')));}else if(t.hasAttribute('data-action'))doAction(t.getAttribute('data-action'));});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});window.addEventListener('pagehide',stopSpeech);
importfile.addEventListener('change',()=>{importState(importfile.files?.[0]);importfile.value='';});
window.addEventListener('keydown',ev=>{if(!state||!app.contains(document.activeElement))return;if(state.index>=state.queue.length)return;const t=document.activeElement;if(t && ['BUTTON','INPUT','TEXTAREA'].includes(t.tagName))return;if(['1','2','3'].includes(ev.key)){setChoice(Number(ev.key)-1);}});
if(kioskLocked){deviceMode='shared';}
else{
 try{if(localStorage.getItem(DEVICE_PREF)==='private'){
  deviceMode='private';emojiVisible=localStorage.getItem(EMOJI_PREF)!=='off';
 }}catch(e){}
}
renderHome();
</script>
