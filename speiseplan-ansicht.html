<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b61f29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studjo">
<title>Speiseplan | Studjo Terminal</title>
<link rel="stylesheet" href="css/speiseplan-ansicht.css">
</head>
<body>

<div class="sp-header">
  <a href="speiseplan.html" target="_self" class="back-button">
    <span aria-hidden="true">←</span> Zurück
  </a>

  <span class="sp-titel" id="sp-titel">📄 Speiseplan</span>

  <button type="button"
          class="sp-bild-link"
          id="sp-bild-link"
          aria-label="Zur bebilderten Darstellung auf Seite 2 wechseln"
          hidden>
    <span aria-hidden="true">🍽️</span>
    <span>Zur Anzeige als Bild</span>
  </button>

  <div class="sp-seiten-nav" id="sp-seiten-nav" hidden>
    <button type="button" id="sp-btn-prev" aria-label="Vorherige Seite">‹</button>
    <span id="sp-seiten-info">Seite 1 von 1</span>
    <button type="button" id="sp-btn-next" aria-label="Nächste Seite">›</button>
  </div>
</div>

<div class="sp-frame-wrap" id="sp-frame-wrap">
  <div class="sp-lade" id="sp-lade">
    <div class="sp-spinner"></div>
    Speiseplan wird geladen …
  </div>
  <div id="sp-fehler" class="sp-fehler" hidden>
    <p>Dieser Speiseplan ist noch nicht veröffentlicht.</p>
  </div>
  <div class="sp-canvas-wrap" id="sp-canvas-wrap" hidden>
    <canvas id="sp-canvas"></canvas>
  </div>
</div>

<div class="sp-sr-only" id="sp-sr-hinweis"></div>

<script type="module" src="js/speiseplan-ansicht.js"></script>
<script src="js/gong.js"></script>
</body>
</html>
